name: R2 Prettier Artifact Recovery

on:
  push:
    branches:
      - foundation/r2-one-product-architecture-guard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Prettier version
        run: |
          version="$(./node_modules/.bin/prettier --version)"
          echo "Prettier $version"
          test "$version" = "3.9.6"

      - name: Format authorized R2 files
        run: |
          ./node_modules/.bin/prettier \
            scripts/architecture-check.mjs \
            tests/scripts/architecture-check.test.mjs \
            --write

      - name: Verify authorized R2 files
        run: |
          ./node_modules/.bin/prettier \
            scripts/architecture-check.mjs \
            tests/scripts/architecture-check.test.mjs \
            --check

      - name: Upload formatted artifact
        uses: actions/upload-artifact@v4
        with:
          name: r2-prettier-formatted
          path: |
            scripts/architecture-check.mjs
            tests/scripts/architecture-check.test.mjs
          if-no-files-found: error
          retention-days: 1

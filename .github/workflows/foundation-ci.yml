name: Foundation CI

on:
  push:
    branches:
      - foundation/build-graph-closure
  pull_request:
    branches:
      - phase-0-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://kristou_ci:kristou_ci@127.0.0.1:5432/kristou_ci
        run: npm run db:validate

      - name: Architecture check
        run: npm run architecture:check

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Web build
        run: npm run build:web

      - name: Repository build
        run: npm run build

      - name: Deployment preflight
        run: npm run deploy:preflight

  format-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format authorized Task 1 test
        run: ./node_modules/.bin/prettier --write tests/scripts/workspace-graph.test.mjs

      - name: Verify exact formatting diff
        shell: bash
        run: |
          files="$(git diff --name-only)"
          test "$files" = "tests/scripts/workspace-graph.test.mjs"
          git diff --binary -- tests/scripts/workspace-graph.test.mjs > formatting.patch
          test -s formatting.patch

      - name: Upload formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: task1-formatting-patch
          path: formatting.patch
          if-no-files-found: error

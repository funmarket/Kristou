name: Foundation CI

on:
  push:
    branches:
      - foundation/build-graph-closure
  pull_request:
    branches:
      - phase-0-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Architecture check
        run: npm run architecture:check

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Web build
        run: npm run build:web

      - name: Repository build
        run: npm run build

      - name: Deployment preflight
        run: npm run deploy:preflight

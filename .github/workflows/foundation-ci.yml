name: Foundation CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kristou_ci
          POSTGRES_PASSWORD: kristou_ci
          POSTGRES_DB: kristou_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://kristou_ci:kristou_ci@127.0.0.1:5432/kristou_ci
        run: npm run db:validate

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://kristou_ci:kristou_ci@127.0.0.1:5432/kristou_ci
        run: npm run db:migrate:deploy

      - name: Foundation integration tests
        env:
          DATABASE_URL: postgresql://kristou_ci:kristou_ci@127.0.0.1:5432/kristou_ci
        run: npm run test:integration -- tests/database/foundation.integration.test.ts

      - name: Architecture check
        run: npm run architecture:check

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Web build
        run: npm run build:web

      - name: Repository build
        run: npm run build

      - name: Deployment preflight
        run: npm run deploy:preflight
